name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agent -d agent_runtime"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codex-agent-python/pyproject.toml
      - name: Install Python dependencies
        working-directory: codex-agent-python
        run: pip install -e ".[dev]"
      - name: Apply database migration
        env:
          PGPASSWORD: agent
        run: >-
          psql -h 127.0.0.1 -U agent -d agent_runtime
          -f codex-agent-python/migrations/001_initial_runtime_schema.sql
      - name: Ruff
        working-directory: codex-agent-python
        run: ruff check app tests
      - name: Pytest
        working-directory: codex-agent-python
        env:
          TEST_DATABASE_URL: postgresql+psycopg://agent:agent@127.0.0.1:5432/agent_runtime
        run: pytest

  java-mcp-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven tests
        working-directory: hanress-test
        run: |
          chmod +x mvnw
          ./mvnw test
