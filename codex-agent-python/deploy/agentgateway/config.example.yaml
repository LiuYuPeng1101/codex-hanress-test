# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# 生产原则：
# 1. Codex Runtime 的 LLM / MCP 流量只允许发到本 Gateway。
# 2. Runtime 只携带 Agent Service 签发的短期 RS256 JWT。
# 3. OpenAI API Key / ORDER_MCP_TOKEN 只存在于 agentgateway 的后端配置或 Secret Manager。
# 4. JWT claim 经验证后再转换成业务身份 Header，Java MCP Adapter 不解析 Runtime JWT。

gateways:
  default:
    port: 3000

llm:
  policies:
    jwtAuth:
      mode: strict
      issuer: agent-control-plane
      audiences: [agentgateway]
      jwks:
        file: /etc/agentgateway/runtime-identity-public.pem
    authorization:
      rules:
      - require: >-
          has(jwt.sub) && has(jwt.tenant_id) &&
          has(jwt.conversation_id) && has(jwt.agent_id)
  models:
  - name: "*"
    provider: openAI
    params:
      apiKey: "$OPENAI_API_KEY"

mcp:
  policies:
    jwtAuth:
      mode: strict
      issuer: agent-control-plane
      audiences: [agentgateway]
      jwks:
        file: /etc/agentgateway/runtime-identity-public.pem
    mcpAuthorization:
      rules:
      # 查询工具只要求存在可信业务身份；真实订单系统仍会再次做资源级授权。
      - >-
        mcp.tool.target == "order" && mcp.tool.name == "get_order_status" &&
        has(jwt.sub) && has(jwt.tenant_id) && has(jwt.conversation_id)
      # 写工具在数据面再加一层粗粒度角色限制；Human Approval 与 OMS 最终授权仍独立存在。
      - >-
        mcp.tool.target == "order" && mcp.tool.name == "cancel_order" &&
        has(jwt.roles) && "order.cancel" in jwt.roles
    transformations:
      request:
        set:
          x-user-id: jwt.sub
          x-tenant-id: jwt.tenant_id
          x-conversation-id: jwt.conversation_id
          x-agent-id: jwt.agent_id
          x-roles: jwt.roles.join(",")
  targets:
  - name: order
    mcp:
      host: http://order-mcp-adapter:8080/mcp
    policies:
      backendAuth:
        key:
          value: "$ORDER_MCP_TOKEN"
